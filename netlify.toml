[build]
    command = "npm run build"
    publish = "dist"
    functions = "netlify/functions"

[build.environment]
    NODE_VERSION = "20"

# The browser calls /api/spoonacular/... ; that path is handled by the function
# so the API key stays on the server.
[[redirects]]
    from = "/api/spoonacular/*"
    to = "/.netlify/functions/spoonacular"
    status = 200
    force = true
